<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
html,body{margin:0;background:#FFFFFF}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo',system-ui,sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all;color:#1F2430}
a{color:#3B5BDB}a:hover{color:#2947B8}
</style>
<template id="__bundler_thumbnail" data-bg-color="#FFFFFF"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect x="20" y="70" width="46" height="60" rx="8" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="3"></rect><path d="M72 100h28" stroke="#3A4150" stroke-width="3"></path><path d="M96 94l8 6-8 6z" fill="#3A4150"></path><polygon points="112,86 160,86 150,114 102,114" fill="#FFE6CC" stroke="#D79B00" stroke-width="3"></polygon><polygon points="131,124 156,150 131,176 106,150" fill="#D5E8D4" stroke="#82B366" stroke-width="3"></polygon></svg></template>
</helmet>
<div style="position:relative;width:{{ W }}px;height:{{ H }}px;background:#FFFFFF">
  <div style="position:absolute;left:40px;top:28px;display:flex;flex-direction:column;gap:6px">
    <div style="font-size:12px;font-weight:500;letter-spacing:.06em;color:#7A8090">순공 · 유저플로우 다이어그램</div>
    <div style="font-size:24px;font-weight:700;letter-spacing:-.02em">화면 · 액션 · 조건</div>
    <div style="display:flex;gap:18px;margin-top:8px;align-items:center;font-size:12px;color:#5C6370">
      <span style="display:inline-flex;align-items:center;gap:6px"><span style="width:22px;height:14px;border-radius:4px;background:#DAE8FC;border:1px solid #6C8EBF"></span>페이지 · 모달 · 시트 (실제 화면)</span>
      <span style="display:inline-flex;align-items:center;gap:6px"><span style="width:22px;height:14px;background:#FFE6CC;border:1px solid #D79B00;transform:skewX(-18deg)"></span>유저 액션</span>
      <span style="display:inline-flex;align-items:center;gap:6px"><span style="width:14px;height:14px;background:#D5E8D4;border:1px solid #82B366;transform:rotate(45deg) scale(.8)"></span>조건 (Yes / No)</span>
      <span style="display:inline-flex;align-items:center;gap:6px"><span style="width:22px;height:14px;border-radius:999px;background:#F2F3F7;border:1px dashed #9AA1B0"></span>다른 흐름으로 이동</span>
      <span style="display:inline-flex;align-items:center;gap:6px"><span style="width:14px;height:14px;border-radius:999px;background:#EEE9FF;border:1px solid #8B78D9"></span>프리미엄 게이트 뒤</span>
    </div>
  </div>

  <svg style="position:absolute;left:0;top:0;pointer-events:none" width="{{ W }}" height="{{ H }}" viewBox="0 0 {{ W }} {{ H }}">
    <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3A4150"></path></marker></defs>
    <sc-for list="{{ edges }}" as="e" hint-placeholder-count="60">
      <path d="{{ e.d }}" fill="none" stroke="#3A4150" stroke-width="1.5" marker-end="url(#ah)"></path>
    </sc-for>
    <sc-for list="{{ labels }}" as="l" hint-placeholder-count="20">
      <rect x="{{ l.bx }}" y="{{ l.by }}" width="{{ l.bw }}" height="18" rx="4" fill="#FFFFFF"></rect>
      <text x="{{ l.x }}" y="{{ l.y }}" font-size="12" font-weight="700" fill="#1F2430" text-anchor="middle">{{ l.t }}</text>
    </sc-for>
  </svg>

  <sc-for list="{{ lanes }}" as="ln" hint-placeholder-count="10">
    <div style="position:absolute;left:40px;top:{{ ln.y }}px;width:{{ ln.w }}px;border-top:1px solid #E6E8EE;padding-top:8px;display:flex;align-items:baseline;gap:10px"><span style="font-size:11px;font-weight:700;color:#7A8090;letter-spacing:.06em">{{ ln.num }}</span><span style="font-size:15px;font-weight:700;letter-spacing:-.02em">{{ ln.title }}</span><span style="font-size:12px;color:#7A8090">{{ ln.sub }}</span></div>
  </sc-for>

  <sc-for list="{{ pages }}" as="n" hint-placeholder-count="40">
    <div style="position:absolute;left:{{ n.x }}px;top:{{ n.y }}px;width:{{ n.w }}px;height:300px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px">
      <div style="width:{{ n.tw }}px;height:{{ n.th }}px;border-radius:14px;overflow:hidden;background:#F5F5F7;border:1px solid {{ n.bd }};box-shadow:0 1px 2px rgba(0,0,0,.04);position:relative">
        <div style="position:absolute;left:0;top:0;width:{{ n.fw }}px;height:{{ n.fh }}px;transform:scale({{ n.sc }});transform-origin:0 0;pointer-events:none;overflow:hidden">
          <dc-import name="SoonGong Prototype" embed="{{ true }}" screen="{{ n.screen }}" state="{{ n.state }}" theme="{{ n.theme }}" overlay="{{ n.overlay }}" plan="{{ n.plan }}" device="{{ n.device }}" hint-size="390px,844px" style="position:absolute;left:0;top:0;width:{{ n.fw }}px;height:{{ n.fh }}px"></dc-import>
        </div>
      </div>
      <div style="width:{{ n.w }}px;box-sizing:border-box;padding:5px 8px;border-radius:6px;background:{{ n.bg }};border:1px solid {{ n.bd }};font-size:11.5px;font-weight:600;line-height:1.3;text-align:center;color:#1F2430">{{ n.label }}</div>
    </div>
  </sc-for>

  <sc-for list="{{ actions }}" as="n" hint-placeholder-count="40">
    <div style="position:absolute;left:{{ n.x }}px;top:{{ n.y }}px;width:130px;height:46px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11.5px;font-weight:500;line-height:1.3;color:#1F2430;padding:0 10px;box-sizing:border-box;background:#FFE6CC;border:1px solid #D79B00;clip-path:polygon(10% 0,100% 0,90% 100%,0 100%)">{{ n.label }}</div>
  </sc-for>

  <sc-for list="{{ conds }}" as="n" hint-placeholder-count="12">
    <div style="position:absolute;left:{{ n.x }}px;top:{{ n.y }}px;width:130px;height:76px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;font-weight:500;line-height:1.3;color:#1F2430;padding:0 22px;box-sizing:border-box;background:#D5E8D4;border:1px solid #82B366;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)">{{ n.label }}</div>
  </sc-for>

  <sc-for list="{{ refs }}" as="n" hint-placeholder-count="12">
    <div style="position:absolute;left:{{ n.x }}px;top:{{ n.y }}px;width:130px;height:36px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11.5px;font-weight:600;color:#5C6370;border-radius:999px;background:#F2F3F7;border:1px dashed #9AA1B0;padding:0 10px;box-sizing:border-box">{{ n.label }}</div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const CW = 222, X0 = 60, PW = 150, PH = 300, AW = 130, AH = 46, DW = 130, DH = 76, RW = 130, RH = 36;
    const nodes = {}, edges = [], labels = [], lanes = [];
    let laneY = 130;
    // helpers: col → x, row (0 main, 1 sub) → center y
    const P = (id, col, row, label, screen, state, extra) => { nodes[id] = Object.assign({ id, t: 'page', col, row, label, screen, state: state || '', theme: 'a', overlay: '', plan: 'paid', ai: false, device: '' }, extra || {}); };
    const A = (id, col, row, label) => { nodes[id] = { id, t: 'act', col, row, label }; };
    const C = (id, col, row, label) => { nodes[id] = { id, t: 'cond', col, row, label }; };
    const R = (id, col, row, label) => { nodes[id] = { id, t: 'ref', col, row, label }; };
    const E = (a, b, lab) => edges.push({ a, b, lab });
    const lane = (num, title, sub, hasSub, build) => {
      const cy0 = laneY + 50 + PH / 2, cy1 = cy0 + PH + 40;
      const before = Object.keys(nodes).length;
      build();
      let maxRow = 0; Object.keys(nodes).slice(before).forEach(k => { const n = nodes[k]; n.cy = cy0 + n.row * (PH + 40); maxRow = Math.max(maxRow, n.row); });
      lanes.push({ key: num, num, title, sub, y: laneY, w: 2700 });
      laneY += 50 + PH + maxRow * (PH + 40) + 70;
    };
    const AI = { ai: true }, FREE = { plan: 'free' };

    lane('00', '시작 · 로그인 · 온보딩', '로그인 필수 · 기록은 계정에 동기화(사진 제외) · 로그인 시 구독 자동 복원', true, () => {
      R('r00', 0, 0, '앱 첫 실행'); P('login', 1, 0, '로그인 · Apple / Google / 카카오 / 이메일', 'login', 'default', {}); C('c00', 2, 0, '기존 계정?'); P('ob1', 3, 0, '온보딩 1 · 순공 측정', 'onboard', '1', {}); P('ob2', 4, 0, '온보딩 2 · 판독 동의 (3문장)', 'onboard', '2', {}); P('ob3', 5, 0, '온보딩 3 · 카메라 권한', 'onboard', '3', {}); P('homeEmpty', 6, 0, '홈 · 빈 상태', 'home', 'empty', {});
      R('r00b', 3, 1, '기존 계정 → 기록 91세션 불러옴 · 구독 자동 복원 → 홈'); A('a00', 1, 1, '이메일로 계속'); P('lgEmail', 2, 1, '이메일 입력 → 기존/신규 판별', 'login', 'email', {}); P('lgPw', 3, 2, '비밀번호 · 기존 계정 · 재설정 링크', 'login', 'pw', {}); P('lgSignup', 4, 2, '비밀번호 · 새 계정 만들기', 'login', 'signup', {});
      P('lgBusy', 1, 2, '로그인 중', 'login', 'busy', {}); P('lgFail', 2, 2, '로그인 실패 · 다시 시도 / 다른 방법', 'login', 'fail', {}); P('lgReset', 5, 1, '재설정 메일 발송 안내', 'login', 'reset', {});
      A('a02', 4, 1, '건너뛰기 (판독 꺼짐)'); A('a03', 5, 2, '수동 타이머로 시작'); R('r03', 6, 1, '개인정보 › 카메라 OFF 상태로 홈');
      R('r04', 8, 0, '설정 › 계정'); P('acctLogout', 9, 0, '로그아웃 확인 · 사진은 기기에서 삭제', 'settings', '', { overlay: 'acctLogout' }); P('acctDelete', 9, 1, '계정 삭제 확인 · 동기화 기록 전체 삭제', 'settings', '', { overlay: 'acctDelete' }); R('r05', 10, 0, '→ 로그인 화면');
      E('r00', 'login'); E('login', 'c00'); E('c00', 'ob1', '신규'); E('c00', 'r00b', '기존'); E('ob1', 'ob2'); E('ob2', 'ob3'); E('ob3', 'homeEmpty'); E('login', 'a00'); E('a00', 'lgEmail'); E('lgEmail', 'lgPw', '기존'); E('lgEmail', 'lgSignup', '신규'); E('lgPw', 'lgReset', '잊었어요'); E('login', 'lgBusy'); E('lgBusy', 'lgFail', '실패'); E('lgFail', 'login', '다시');
      E('ob2', 'a02'); E('a02', 'ob3'); E('ob3', 'a03'); E('a03', 'r03'); E('r04', 'acctLogout'); E('r04', 'acctDelete'); E('acctLogout', 'r05'); E('acctDelete', 'r05');
    });

    lane('01', '홈 → 집중 세션', '시작 준비 → 측정 → 자리 비움 → 기록·정정', true, () => {
      P('home', 0, 0, '홈 (무료)', 'home', 'default', FREE); A('a11', 1, 0, '집중 시작 버튼 클릭'); C('c11', 2, 0, '카메라 권한 있나?'); P('setupOn', 3, 0, '집중 시작 준비 · 카메라 ON', 'setup', 'on');
      A('a12', 4, 0, '시작 버튼 클릭'); C('c12', 5, 0, '카메라 정상?'); P('focus', 6, 0, '집중 중 · 착석 (일시정지 ↔ 이어서는 같은 화면)', 'focus', 'sit'); C('c13', 7, 0, '자리 비움 감지?'); A('a13', 8, 0, '종료 버튼 클릭'); P('summary', 9, 0, '집중 기록', 'summary', 'default'); A('a14', 10, 0, '저장 버튼 클릭'); R('r11', 11, 0, '홈으로');
      P('setupDen', 2, 1, '준비 · 권한 거부', 'setup', 'denied'); A('a15', 3, 1, '수동 타이머로 시작 → 집중 중');
      P('errCam', 5, 1, '오류 · 카메라 점유', 'setup', 'cambusy'); A('a16', 6, 1, '다시 시도 / 수동으로');
      P('away', 7, 1, '자리 비움 감지 → 복귀 시 자동 재개(집중 중)', 'focus', 'away'); P('awayLong', 8, 1, '5분 초과 · 계속하기 / 종료하기 제안', 'focus', 'away', { overlay: 'awayLong' }); R('r12', 8, 2, '계속하기 → 집중 중 (측정 재개)');
      A('a18', 9, 1, '잘못 감지 구간 되돌리기'); P('toast', 10, 1, '감도 조정 토스트 → 정정 이력', 'summary', 'default', { overlay: 'toast' });
      E('home', 'a11'); E('a11', 'c11'); E('c11', 'setupOn', 'Yes'); E('c11', 'setupDen', 'No'); E('setupDen', 'a15');
      E('setupOn', 'a12'); E('a12', 'c12'); E('c12', 'focus', 'Yes'); E('c12', 'errCam', 'No'); E('errCam', 'a16');
      E('focus', 'c13'); E('c13', 'a13', 'No'); E('c13', 'away', 'Yes'); E('away', 'awayLong', '5분'); E('awayLong', 'a13', '종료'); E('awayLong', 'r12', '계속'); E('a13', 'summary'); E('summary', 'a14'); E('a14', 'r11'); E('summary', 'a18'); E('a18', 'toast');
    });

    lane('02', '플래너', '월간 → 접힘 → 등록 시트 · 3D · 반복 일정', true, () => {
      R('r21', 0, 0, '홈 · 탭바'); A('a21', 1, 0, '플래너 탭 클릭'); P('planner', 2, 0, '플래너 · 월간', 'planner', ''); A('a22', 3, 0, '날짜 탭 / 세로 드래그'); P('planFold', 4, 0, '플래너 · 접힘 + 날짜 상세', 'planner', '', { overlay: 'planFold' });
      A('a23', 5, 0, '+ 버튼 클릭'); P('addSheet', 6, 0, '등록 시트 · 공부/할 일/자습/일정', 'planner', '', { overlay: 'addSheet' }); A('a24', 7, 0, '날짜 칩 클릭'); P('datePick', 8, 0, '날짜 선택 미니 달력', 'planner', '', { overlay: 'datePick' });
      A('a25', 2, 1, '좌우 스와이프'); P('plan3d', 3, 1, '플래너 · 3D 시간 보기', 'planner', '', { overlay: 'plan3d' });
      A('a26', 6, 1, '종류: 일정 › 반복 선택'); P('repeatSheet', 7, 1, '반복 일정 · 요일·시간·종료', 'planner', '', { overlay: 'repeatSheet' });
      E('r21', 'a21'); E('a21', 'planner'); E('planner', 'a22'); E('a22', 'planFold'); E('planFold', 'a23'); E('a23', 'addSheet'); E('addSheet', 'a24'); E('a24', 'datePick');
      E('planner', 'a25'); E('a25', 'plan3d'); E('addSheet', 'a26'); E('a26', 'repeatSheet');
    });

    lane('03', '타임테이블 · 세션 상세 · 제안 받기', '', true, () => {
      A('a31', 0, 0, '타임테이블 탭 클릭'); P('tt', 1, 0, '타임테이블 · 주간 24시', 'timetable', ''); A('a32', 2, 0, '순공 블록 탭'); P('session', 3, 0, '세션 상세', 'session', ''); A('a33', 4, 0, '기록 삭제 클릭'); P('sessDel', 5, 0, '기록 삭제 확인 모달', 'session', '', { overlay: 'sessDel' });
      R('r31', 7, 0, '플래너'); A('a34', 8, 0, '제안 받기 칩 클릭'); C('c31', 9, 0, '프리미엄인가?'); P('suggest', 10, 0, '제안 받기 시트 → 플래너에 추가 + 토스트', 'planner', '', Object.assign({ overlay: 'suggest' }, AI));
      R('r32', 9, 1, '페이월 시트 → 7일 무료 → 제안');
      E('a31', 'tt'); E('tt', 'a32'); E('a32', 'session'); E('session', 'a33'); E('a33', 'sessDel');
      E('r31', 'a34'); E('a34', 'c31'); E('c31', 'suggest', 'Yes'); E('c31', 'r32', 'No');
    });

    lane('04', '성취 축 · 촬영 → 사진 확인 → 판독 요청', '프리미엄 · 조건은 순서대로: 잔여 횟수 → 인터넷 → 판독 중', true, () => {
      R('r41', 0, 0, '플래너 공부 행 / 홈 / 오답'); A('a41', 1, 0, '카메라 버튼 클릭'); C('c41', 2, 0, '프리미엄인가?'); P('capture', 3, 0, '촬영 · 선택 수 배지', 'capture', '', AI); A('a42', 4, 0, '촬영 / 앨범(OS) 클릭'); P('photos', 5, 0, '사진 확인 · 현재/목록 · 과목·범위', 'photos', 'default', AI); A('a48', 6, 0, '판독 요청 클릭'); C('c42', 7, 0, '잔여 횟수?'); C('c43', 8, 0, '인터넷 연결?'); P('sending', 9, 0, '전송 중 · 전송 취소', 'photos', 'default', Object.assign({ overlay: 'sending' }, AI)); C('c44', 10, 0, '전송 됐나?'); P('reading', 11, 0, '판독 중 · N장', 'reading', '', AI);
      P('paywall', 2, 1, '페이월 시트 → 7일 무료 → 촬영', 'home', 'default', Object.assign({ overlay: 'paywall' }, FREE, AI)); P('pwConsent', 2, 2, '페이월 · 동의 단계 (온보딩 건너뜀)', 'home', 'default', Object.assign({ overlay: 'pwConsent' }, FREE, AI));
      P('capDenied', 3, 1, '카메라 권한 꺼짐 → 앨범 / 기기 설정 → 복귀 재확인', 'capture', 'denied', Object.assign({ overlay: 'capSettings' }, AI)); A('a46', 3, 2, '정답지 버튼'); P('answer', 4, 2, '정답지 · 곧 제공 시트', 'capture', '', Object.assign({ overlay: 'answer' }, AI));
      P('phEmpty', 5, 1, '사진 없음 → 촬영 / 앨범', 'photos', 'empty', AI); P('phMissing', 5, 2, '범위 비어 있음 → 요청 불가 안내', 'photos', 'missing', AI); P('phPlanner', 4, 1, '플래너 진입 · 할 일·과목·범위 이어받음', 'photos', 'planner', AI);
      A('a49', 6, 1, '재촬영 / 삭제 / 추가 / 썸네일 이동'); R('r42', 6, 2, '취소 → 출발 화면 (플래너/오답)');
      P('quota', 7, 1, '판독 소진 → 요금제 / 닫기', 'capture', '', Object.assign({ overlay: 'quota' }, AI)); P('errOff', 8, 1, '오프라인 · 다시 시도(연결 재확인) / 사진 두고 나중에', 'photos', 'default', Object.assign({ overlay: 'capOfflineDlg' }, AI));

    Object.values(nodes).forEach(n => { let [w, hh] = dim[n.t]; const tab = n.t === 'page' && n.device === 'tablet'; if (tab) w = 300; n.cx = X0 + n.col * CW + PW / 2 + (tab ? (300 - PW) / 2 : 0); n.w = w; n.h = hh; n.x = n.cx - w / 2; n.y = n.cy - hh / 2;
      if (n.t === 'page') { n.fw = tab ? 1024 : 390; n.fh = tab ? 768 : 844; n.sc = tab ? 300 / 1024 : .31; n.tw = Math.round(n.fw * n.sc); n.th = Math.round(n.fh * n.sc); } });
    const pages = [], actions = [], conds = [], refs = [];
    Object.values(nodes).forEach(n => {
      const o = Object.assign({ key: n.id }, n);
      if (n.t === 'page') { o.bg = n.ai ? '#EEE9FF' : '#DAE8FC'; o.bd = n.ai ? '#8B78D9' : '#6C8EBF'; pages.push(o); }
      else if (n.t === 'act') actions.push(o); else if (n.t === 'cond') conds.push(o); else refs.push(o);
    });
    const edgeOut = edges.map((e, i) => {
      const a = nodes[e.a], b = nodes[e.b]; if (!a || !b) return null;
      let d, lx, ly;
      if (Math.abs(a.cy - b.cy) < 4) { // same row → right to left
        const x1 = a.cx + a.w / 2, x2 = b.cx - b.w / 2; d = 'M' + x1 + ' ' + a.cy + ' L' + x2 + ' ' + a.cy; lx = (x1 + x2) / 2; ly = a.cy - 8;
      } else if (Math.abs(a.cx - b.cx) < 4 && b.cy > a.cy) { // same col → down
        const y1 = a.cy + a.h / 2, y2 = b.cy - b.h / 2; d = 'M' + a.cx + ' ' + y1 + ' L' + a.cx + ' ' + y2; lx = a.cx + 16; ly = (y1 + y2) / 2 + 4;
      } else if (Math.abs(a.cx - b.cx) < 4) { // same col → up
        const y1 = a.cy - a.h / 2, y2 = b.cy + b.h / 2; d = 'M' + a.cx + ' ' + y1 + ' L' + a.cx + ' ' + y2; lx = a.cx + 16; ly = (y1 + y2) / 2 + 4;
      } else if (b.cy > a.cy) { // below-right: down then right
        const y1 = a.cy + a.h / 2, x2 = b.cx - b.w / 2; d = 'M' + a.cx + ' ' + y1 + ' L' + a.cx + ' ' + b.cy + ' L' + x2 + ' ' + b.cy; lx = (a.cx + x2) / 2; ly = b.cy - 8;
      } else { // above-right: right then up
        const x1 = a.cx + a.w / 2, y2 = b.cy + b.h / 2; d = 'M' + x1 + ' ' + a.cy + ' L' + b.cx + ' ' + a.cy + ' L' + b.cx + ' ' + y2; lx = (x1 + b.cx) / 2; ly = a.cy - 8;
      }
      if (e.lab) { const bw = e.lab.length * 7 + 10; labels.push({ key: 'l' + i, t: e.lab, x: lx, y: ly, bx: lx - bw / 2, by: ly - 13, bw }); }
      return { key: 'e' + i, d };
    }).filter(Boolean);
    return { W: 17 * CW + 120, H: laneY + 40, pages, actions, conds, refs, edges: edgeOut, labels, lanes };
  }
}
