name: native-check
on:
  pull_request:
    paths: ['third_party/**', 'android/**', 'ios/**', 'lib/data/engines/gaze/**', 'lib/data/db/**', 'pubspec.*', 'tool/fetch_gaze_model.py', '.github/workflows/native-check.yml']
  workflow_dispatch:
concurrency:
  group: native-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: python3 tool/fetch_gaze_model.py
      - run: flutter pub get
      - run: flutter build apk --debug --flavor dev --dart-define-from-file=env/app.dev.example.json
      - name: Exercise owned picker and direct share native contracts
        working-directory: android
        run: ./gradlew :image_picker_android:testDebugUnitTest --tests io.flutter.plugins.imagepicker.OwnedImageStoreTest :app:testDevDebugUnitTest --tests co.byite.soongong.OwnedShareBridgeTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owned-native-android-tests
          path: |
            build/image_picker_android/test-results/
            build/app/test-results/
  ios-device:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: python3 tool/fetch_gaze_model.py
      - run: flutter pub get
      - name: Exercise iOS ownership writer and real pre-callback process exit
        run: |
          src=third_party/image_picker_ios/ios/image_picker_ios/Sources/image_picker_ios
          clang -fobjc-arc -fblocks -framework Foundation -I "$src/include/image_picker_ios" "$src/FIPOwnedImageStore.m" third_party/owned_native_tests/OwnedImageStoreTests.m -o /tmp/soongong-owned-native-tests
          /tmp/soongong-owned-native-tests
      # ML Kit excludes arm64 simulators; MediaPipe 1.1.0 ships ARM64 binaries.
      # Device ARM64 is their common target. No signing or deployment occurs.
      - name: Build iPhone release without signing
        run: flutter build ios --release --flavor dev --no-codesign --dart-define-from-file=env/app.dev.example.json
      - name: Diagnose iOS dependency linkage on failure
        if: failure()
        run: |
          cat ios/Podfile
          cat ios/Runner.xcworkspace/contents.xcworkspacedata
          xcodebuild -workspace ios/Runner.xcworkspace -scheme dev -configuration Release-dev -sdk iphoneos -showBuildSettings > /tmp/soongong-ios-settings.txt
          grep -E 'CONFIGURATION_BUILD_DIR|FRAMEWORK_SEARCH_PATHS|PODS_|EXCLUDED_ARCHS|SDKROOT' /tmp/soongong-ios-settings.txt
          cat 'ios/Pods/Target Support Files/Pods-Runner/Pods-Runner.release-dev.xcconfig'
          find build/ios -name 'Pods_Runner*' -print
