name: native-check
on:
  pull_request:
    paths: ['android/**', 'ios/**', 'lib/data/engines/gaze/**', 'lib/data/db/**', 'pubspec.*', 'tool/fetch_gaze_model.py', '.github/workflows/native-check.yml']
  workflow_dispatch:
concurrency:
  group: native-check-${{ github.ref }}
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: python3 tool/fetch_gaze_model.py
      - run: flutter pub get
      - run: flutter build apk --debug --flavor dev --dart-define-from-file=env/app.dev.example.json
  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: python3 tool/fetch_gaze_model.py
      - run: flutter pub get
      - run: flutter build ios --simulator --debug --flavor dev --no-codesign --dart-define-from-file=env/app.dev.example.json
