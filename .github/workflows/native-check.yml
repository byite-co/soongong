name: native-check
on:
  pull_request:
    paths: ['android/**', 'ios/**', 'lib/data/engines/gaze/**', 'lib/data/db/**', 'pubspec.*', 'tool/fetch_gaze_model.py', '.github/workflows/native-check.yml']
  workflow_dispatch:
concurrency:
  group: native-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: python3 tool/fetch_gaze_model.py
      - run: flutter pub get
      - run: flutter build apk --debug --flavor dev --dart-define-from-file=env/app.dev.example.json
  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: python3 tool/fetch_gaze_model.py
      - run: flutter pub get
      - name: Build iOS simulator with bounded diagnostic output
        shell: bash
        run: |
          set -o pipefail
          flutter build ios --simulator --debug --flavor dev --no-codesign --dart-define-from-file=env/app.dev.example.json --verbose 2>&1 | tee /tmp/soongong-ios-build.log | grep -E 'Error \(Xcode\)|error:|warning:|Built |Xcode build done|Failed to build|EXCLUDED_ARCHS|Skipping implicit dependency|ignoring implicit dependency|TARGET_BUILD_DIR =|CONFIGURATION_BUILD_DIR ='
      - name: Diagnose iOS dependency linkage on failure
        if: failure()
        run: |
          cat ios/Podfile
          cat ios/Runner.xcworkspace/contents.xcworkspacedata
          xcodebuild -workspace ios/Runner.xcworkspace -scheme dev -configuration Debug-dev -sdk iphonesimulator -showBuildSettings > /tmp/soongong-ios-settings.txt
          grep -E 'CONFIGURATION_BUILD_DIR|FRAMEWORK_SEARCH_PATHS|PODS_|EXCLUDED_ARCHS|SDKROOT' /tmp/soongong-ios-settings.txt
          cat 'ios/Pods/Target Support Files/Pods-Runner/Pods-Runner.debug-dev.xcconfig'
          xcodebuild -project ios/Pods/Pods.xcodeproj -target Pods-Runner -configuration Debug-dev -sdk iphonesimulator -showBuildSettings > /tmp/soongong-pods-settings.txt
          grep -E 'CONFIGURATION_BUILD_DIR|FRAMEWORK_SEARCH_PATHS|PODS_|EXCLUDED_ARCHS|SDKROOT|PRODUCT_NAME' /tmp/soongong-pods-settings.txt
          find build/ios -name 'Pods_Runner*' -print
