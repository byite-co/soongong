name: soongong
description: "순공 · 순공시간 측정 · 플래너 · AI 판독 (SoonGong)"
publish_to: 'none'

# Version: build-name+build-number. Android versionName/versionCode, iOS CFBundleShortVersionString/CFBundleVersion.
version: 0.1.0+1

# D12: Flutter stable 3.47.5 / Dart 3.13.4 fixed at S01. See docs/versions.md and .fvmrc.
environment:
  sdk: '>=3.13.4 <4.0.0'
  flutter: '>=3.47.5'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State (CLAUDE.md §2)
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # Routing
  go_router: ^18.0.2

  # Models / codegen annotations
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Local DB (drift + drift_flutter → sqlite3 native assets; sqlite3_flutter_libs is EOL)
  drift: ^2.35.0
  drift_flutter: ^0.3.1

  # Backend
  supabase_flutter: ^2.18.0

  # Utilities
  intl: ^0.20.3
  uuid: ^4.6.0
  logger: ^2.8.0
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  file_picker: ^13.1.0
  image_picker: ^1.2.3

  # Notifications
  flutter_local_notifications: ^22.3.1

  # Billing (RevenueCat)
  purchases_flutter: ^10.13.2

  # Camera + on-device seat detection (S04)
  camera: ^0.12.1
  google_mlkit_face_detection: ^0.15.1
  # [S04] Camera permission status / request / open-settings (setupDen flow).
  # 12.x pinned: 13.x pulls permission_handler_android 14 (compileSdk 37) —
  # see docs/versions.md.
  permission_handler: ^12.0.3
  # [S04] Battery % for the /_seat_lab measurement harness (dev only at runtime).
  battery_plus: ^7.1.1

  # [S01] New packages — reasons in docs/handoff/S01.md
  # deviceId is kept in platform secure storage (Keychain / EncryptedSharedPreferences).
  flutter_secure_storage: ^11.2.0
  # Lucide icon set (PRD §8: Lucide 24px, stroke 1.75). `lucide_icons` is unmaintained (2023).
  lucide_icons_flutter: ^3.1.20
  # Accelerometer stream for the dev-menu shake gesture (dev flavor only).
  sensors_plus: ^7.1.0
  archive: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

  # Codegen pipeline: `dart run build_runner build --delete-conflicting-outputs`
  build_runner: ^2.16.1
  riverpod_generator: ^4.0.9
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  drift_dev: ^2.35.0

  # Riverpod lints — native analyzer plugin (declared in analysis_options.yaml `plugins:`)
  riverpod_lint: ^3.1.9

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/LICENSE-Pretendard.txt

  # Pretendard Variable (OFL-1.1), wght 45–930. Weight is selected through the
  # `wght` axis; see core/theme/tokens.dart (AppTypography).
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/PretendardVariable.ttf
